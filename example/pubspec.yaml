name: verba_example
description: Minimal app using verba_translations (ARB fetch/push + OTA).
publish_to: none
version: 1.0.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  verba_translations:
    path: ..

flutter:
  generate: true
  uses-material-design: true

verba:
  project: my-project
