name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Generate example localizations
        working-directory: example
        run: flutter pub get && flutter gen-l10n
      - run: flutter analyze
      - run: flutter test
