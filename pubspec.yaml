name: verba_translations
description: >-
  Verba for Flutter — fetch approved translations into your ARB files, push new keys back to Verba,
  and update texts over the air without a new release.
version: 1.0.0
homepage: https://verba.kred
repository: https://github.com/IKristea/verba-flutter

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  intl: ">=0.19.0 <1.0.0"
  shared_preferences: ^2.2.0
  yaml: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

executables:
  verba_translations:
